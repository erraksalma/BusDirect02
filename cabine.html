<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BusDirect</title>
    <meta
      name="description"
      content="BusDirect un site degestion des réservations de sièges pour les trajets entre les villes safi et marrakech" />
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body class="flex min-h-screen flex-col bg-yellow-50 text-yellow-950">
    <header class="bg-yellow-100 shadow-md">
      <nav
        class="mx-auto flex max-w-7xl items-center gap-3 px-2 py-1 sm:px-6 lg:px-8" >
        <img
          src="/img/logo.png"
          alt="BusDirect logo"
          class="h-12 w-12 object-contain sm:h-16 sm:w-16" />
        <div class="min-w-0">
          <h1
            class="text-xl font-extrabold tracking-tight text-blue-950 sm:text-2xl"
          >
            Bus<span class="text-yellow-500">Direct</span>
          </h1>

        </div>
      </nav>
    </header>
    <main
      class="mx-auto w-full max-w-7xl flex-1 px-4 py-6 sm:px-6 lg:px-8">
    <div class="flex flex-row justify-between  rounded-lg bg-yellow-100 p-3  text-blue-950 text-xs font-medium sm:text-sm ">
      <!-- <p>Safi → Marrakech <span class="rounded-lg bg-blue-950   text-yellow-100 p-1 shadow-md ">80 DH/place</span></p> -->
      <div class="flex justify-between flex-wrap gap-2 mt-3" >
      <p>
        <span id="departure">  </span>
                 =>
        <span id="destination">  </span>
      </p>
<span id="price"></span>

      </div>
      <div class="flex justify-between flex-wrap gap-2 mt-3">
        <p>Depart :  <span id="departureTime"></span></p>
        <p>Arrive : <span id="arrivalTime"></span></p>
      </div>

<p class="mt-3">🔴 Occupe 🟢 Disponible 🟡VIP</p>
<a href="./index.html" class="inline-block mb-4 rounded-xl bg-blue-950 px-4 py-2 font-semibold text-yellow-100 shadow-md hover:bg-blue-900 mt-3"> Retour aux trajets</a>

      <!-- <span>🔴 Occupe 🟢 Disponible</span> -->
    </div>
      <section class="grid grid-cols-1 items-start gap-6 lg:grid-cols-[1.2fr_0.8fr] py-6">
       <div class="bg-yellow-100  p-6  ">
        <div class=" flex gap-2 items-center justify-between flex-wrap gap-y-1 " >
          <span class="text-blue-950 text-xs font-medium sm:text-sm">⚪<span id="total">20</span> places totales</span>
<span class="text-blue-950 text-xs font-medium sm:text-sm">🟢<span id="libres">20</span> places disponibles</span>
<span class="text-blue-950 text-xs font-medium sm:text-sm">💰Recette : <span id="recette">0</span> DH</span>
        </div>
        <div class="bg-blue-950 border border-yellow-200 rounded-3xl my-6 p-6">
           <div class="mb-4   rounded-lg justify-center    bg-yellow-50 px-4 py-3 text-sm font-semibold text-blue-950">
           <span>  Poste Conducteur </span>
          </div>
          <!-- <div id="seats" class="grid grid-cols-4 gap-3"></div> -->
          <div id="seats" class="grid gap-3" style="grid-template-columns: repeat(4, minmax(0, 1fr))">

</div>
        </div>
       </div>
       <div class="space-y-6">
       <form id="reservation-form" class="bg-yellow-100 p-6">
    <h2 class="mb-4  border-b border-yellow-200 pb-3 text-base font-bold text-blue-950">
       Réserver une place
    </h2>
    <div class="space-y-4">
      <div>
        <label for="reserve-name" class="mb-1 block text-xs font-semibold text-blue-950">Pasager</label>
        <input id="reserve-name" type="text" placeholder="Ex:Salma Errak"
          class="w-full  bg-white px-3 py-2 text-sm text-blue-950  focus:outline-none focus:ring-2 focus:ring-blue-950" />
          <p id="error-name" class="text-red-500 text-sm"></p>
      </div>
      <div>
        <label for="reserve-phone" class="mb-1 block text-xs font-semibold text-blue-950">Telephone</label>
        <input id="reserve-phone" type="tel" placeholder="Ex:06...."
          class="w-full  bg-white px-3 py-2 text-sm text-blue-950  focus:outline-none focus:ring-2 focus:ring-blue-950" />
          <p id="error-phone" class="text-red-500 text-sm"></p>
      </div>
      <div>
        <label for="reserve-seat" class="mb-1 block text-xs font-semibold text-blue-950">Siège selectionne</label>
        <div class="flex gap-2">
          <select id="reserve-seat"
            class="min-w-0 flex-1  bg-white px-3 py-2 text-sm text-blue-950 focus:outline-none focus:ring-2 focus:ring-blue-950">
            <option value="">  Sièges</option>
          </select>
          
          <button id="btn-confirm" type="submit"
            class="rounded-xl bg-blue-950 px-4 py-2 text-sm font-semibold text-yellow-100 shadow-md hover:bg-blue-900">
            Confirmer
          </button>
        </div>
      </div>
    </div>
  </form>
  
<form id="attente-form" class="bg-yellow-100 p-6">
    <h2 class="mb-4 border-b border-yellow-200 pb-3 text-base font-bold text-blue-950">
        Liste d'attente
    </h2>

    <div class="space-y-4">
        <div>
            <label for="attente-name" class="mb-1 block text-xs font-semibold text-blue-950">
                Nom du passager
            </label>
            <input id="attente-name" type="text" placeholder="Ex: Salma Errak"
                class="w-full bg-white px-3 py-2 text-sm text-blue-950">
            <p id="attente-error-name" class="text-red-500 text-sm"></p>
        </div>

        <div>
            <label for="attente-phone" class="mb-1 block text-xs font-semibold text-blue-950">
                Téléphone
            </label>
            <input id="attente-phone" type="tel" placeholder="Ex: 06..."
                class="w-full bg-white px-3 py-2 text-sm text-blue-950">
            <p id="attente-error-phone" class="text-red-500 text-sm"></p>
        </div>
       <button id="btn-attente" type="submit"
    class="rounded-xl bg-blue-950 px-4 py-2 text-sm font-semibold text-yellow-100 shadow-md hover:bg-blue-900">
    Rejoindre la liste
</button>
    </div>
</form>
<div class="bg-yellow-100 p-6">
    <h2 class="mb-4 border-b border-yellow-200 pb-3 text-base font-bold text-blue-950">
        Passagers en attente
    </h2>

    <ul id="attente-list"></ul>
</div>
       <form id="modification-form" class="bg-yellow-100 p-6">
    <h2 class="mb-4  border-b border-yellow-200 pb-3 text-base font-bold text-blue-950">
       Modifier une place
    </h2>
    <div class="space-y-4">
      <div>
        <label for="edit-passagerexict" class="mb-1 block text-xs font-semibold text-blue-950">Passager existant</label>
        <select id="edit-passagerexict" class="w-full  bg-white px-3 py-2 text-sm text-blue-950 focus:outline-none focus:ring-2 focus:ring-blue-950">
          <option> Choisir passager </option>
        </select>
      </div>
      <div>
        <label for="edit-name" class="mb-1 block text-xs font-semibold text-blue-950">Nom du passager</label>
        <input id="edit-name" type="text" placeholder="Modifier le nom"
          class="w-full  bg-white px-3 py-2 text-sm text-blue-950  focus:outline-none focus:ring-2 focus:ring-blue-950" />
      </div>
      <div>
    <label for="edit-phone">Téléphone</label>
    <input id="edit-phone" type="text"
        placeholder="Modifier le téléphone"
        class="w-full bg-white px-3 py-2 text-sm text-blue-950">
</div>
      <div>
        <label for="edit-seat" class="mb-1 block text-xs font-semibold text-blue-950">Nouveau siège</label>
        <div class="flex gap-2">
          <select id="edit-seat"
            class="min-w-0 flex-1  bg-white px-3 py-2 text-sm text-blue-950 focus:outline-none focus:ring-2 focus:ring-blue-950">
            <option value=""> Garder meme siège </option>
          </select>
          <button id="btn-edit" type="submit"
            class="rounded-xl bg-blue-950 px-4 py-2 text-sm font-semibold text-yellow-100 shadow-md hover:bg-blue-900">
            Modifier
          </button>
        </div>
      </div>
    </div>
  </form>
<form id="supresion-form" class="bg-yellow-100 p-6">
      <h2 class="mb-4  border-b border-yellow-200 pb-3 text-base font-bold text-blue-950">
       Supprimer une reservation
    </h2>
    <div>
      <label for="delete-passager" class="mb-1 block text-xs font-semibold text-blue-950">Passager reserve</label>
      <div class="flex gap-2">
        <select id="select-passagerexist"
          class="min-w-0 flex-1  bg-white px-3 py-2 text-sm text-blue-950 focus:outline-none focus:ring-2 focus:ring-blue-950">
          <option> Choisir passager </option>
        </select>
        <button id="btn-delete" type="submit"
         class="rounded-xl bg-blue-950 px-4 py-2 text-sm font-semibold text-yellow-100 shadow-md hover:bg-blue-900">
          Supprimer
        </button>
      </div>
    </div>
  </form>
       </div>
      </section>
    </main>
    <footer class="bg-yellow-100 shadow-inner">
      <div class="mx-auto max-w-7xl  py-3 sm:px-6 lg:px-8">
        <p class="text-center text-sm text-blue-950">
          &copy; 2026 BusDirect
        </p>
      </div>
    </footer>
    <script type="module" src="/js/main-cabine.js"></script>
  </body>
</html>
